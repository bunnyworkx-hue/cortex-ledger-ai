[project]
name = "axiom-core"
version = "0.1.0"
description = "Axiom OS shared foundation: config, logging, observability primitives"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axiom_core"]
