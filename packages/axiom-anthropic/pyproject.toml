[project]
name = "axiom-anthropic"
version = "0.1.0"
description = "Cortex Ledger AI Model Gateway adapter for Anthropic (Claude)"
requires-python = ">=3.11"
dependencies = [
    "axiom-core",
    "anthropic>=0.40",
]

[tool.uv.sources]
axiom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axiom_anthropic"]
