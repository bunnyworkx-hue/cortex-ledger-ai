[project]
name = "axiom-hermes"
version = "0.1.0"
description = "Cortex Ledger AI Agent Fabric backend for Hermes Agent (github.com/NousResearch/hermes-agent) — CLAUDE.md's HermesBackend"
requires-python = ">=3.11"
dependencies = [
    "axiom-core",
]

[tool.uv.sources]
axiom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axiom_hermes"]
