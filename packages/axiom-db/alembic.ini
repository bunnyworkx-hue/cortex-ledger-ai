[alembic]
# Paths are resolved relative to the CWD alembic is invoked from, not
# relative to this ini file — always run from the repo root
# (uv run alembic -c packages/axiom-db/alembic.ini ...) so AXIOM_DATABASE_URL
# loads from the root .env too.
script_location = packages/axiom-db/axiom_db/migrations
prepend_sys_path = packages/axiom-db
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
