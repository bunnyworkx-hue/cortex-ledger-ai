[project]
name = "axiom-agent-fabric"
version = "0.1.0"
description = "Cortex Ledger AI Agent Fabric — registry, discovery, and invocation gateway over the agency-agents library"
requires-python = ">=3.11"
dependencies = [
    "axiom-core",
    "pyyaml>=6.0",
]

[tool.uv.sources]
axiom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axiom_agent_fabric"]
