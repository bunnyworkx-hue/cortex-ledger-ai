[project]
name = "axiom-graphify"
version = "0.1.0"
description = "Cortex Ledger AI Knowledge Gateway adapter for Graphify"
requires-python = ">=3.11"
dependencies = [
    "axiom-core",
    "mcp>=1.0",
]

[tool.uv.sources]
axiom-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axiom_graphify"]
