[project]
name = "axiom-api"
version = "0.1.0"
description = "Cortex Ledger AI API — the Cortex Ledger AI control-plane HTTP surface"
requires-python = ">=3.11"
dependencies = [
    "axiom-core",
    "axiom-db",
    "axiom-anthropic",
    "axiom-graphify",
    "axiom-agent-fabric",
    "axiom-mcp",
    "axiom-hermes",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[tool.uv.sources]
axiom-core = { workspace = true }
axiom-db = { workspace = true }
axiom-anthropic = { workspace = true }
axiom-graphify = { workspace = true }
axiom-agent-fabric = { workspace = true }
axiom-mcp = { workspace = true }
axiom-hermes = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["axiom_api"]
